<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #F3F4F6;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #4F46E5;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #10B981;
            /* Green for success */
        }

        .icon {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #111827;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            color: #4B5563;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
        }

        .details-box {
            background-color: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dashed #E5E7EB;
            padding-bottom: 10px;
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            color: #6B7280;
            font-size: 14px;
        }

        .detail-value {
            color: #111827;
            font-weight: 600;
            font-size: 14px;
        }

        .amount {
            font-size: 18px;
            color: #10B981;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #9CA3AF;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://aicureacademy-4c3a9.web.app/assets/ai_cure_logo_new.png" alt="aiCure Academy" style="height: 60px; max-width: 100%; object-fit: contain;" />
        </div>
        <div class="card">
            <div class="icon">
                <span style="font-size: 48px;">🎉</span>
            </div>
            <h2>Payment Successful!</h2>
            <p>Hi {{name}}, we've received your payment. You're all set to start learning!</p>

            <div class="details-box">
                <div class="detail-row">
                    <span class="detail-label">Transaction ID</span>
                    <span class="detail-value">{{transactionId}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Date</span>
                    <span class="detail-value">{{date}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Course</span>
                    <span class="detail-value">{{item}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Coupon Applied</span>
                    <span class="detail-value">{{couponCode}}</span>
                </div>
                <div class="detail-row" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #E5E7EB;">
                    <span class="detail-label" style="font-weight: 600; color: #111827;">Total Paid</span>
                    <span class="detail-value amount">{{amount}}</span>
                </div>
            </div>

            <div style="text-align: center;">
                <a href="https://aicureacademy.com/my-courses"
                    style="background-color: #4F46E5; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block;">Go
                    to Course</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 aiCure Academy. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
