<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Class Scheduled</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #F3F4F6;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #4F46E5;
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #4F46E5;
        }

        h2 {
            color: #111827;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            color: #4B5563;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .details-box {
            background-color: #EEF2FF;
            border: 1px solid #C7D2FE;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .detail-row {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .detail-label {
            font-weight: 600;
            color: #4338CA;
            width: 100px;
            flex-shrink: 0;
        }

        .detail-value {
            color: #1E1B4B;
        }

        .btn {
            display: inline-block;
            background-color: #4F46E5;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #9CA3AF;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://aipharmaguru.web.app/assets/PharmaAIGuru.png" alt="aiCure Academy" style="height: 60px; max-width: 100%; object-fit: contain;" />
        </div>
        <div class="card">
            <h2>🔴 Live Class Scheduled!</h2>
            <p>Hello {{name}},</p>
            <p>A new live class has been scheduled for your course. Get ready to learn!</p>

            <div class="details-box">
                <div class="detail-row">
                    <span class="detail-label">Topic:</span>
                    <span class="detail-value"><strong>{{topic}}</strong></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Time:</span>
                    <span class="detail-value">{{startTime}}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Instructor:</span>
                    <span class="detail-value">{{instructorName}}</span>
                </div>
            </div>

            <p>Make sure to join on time!</p>

            <div style="text-align: center;">
                <a href="{{joinUrl}}" class="btn" style="color: #ffffff;">Join Class</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 aiCure Academy. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
